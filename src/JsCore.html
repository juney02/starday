// 일반적인 서양 별자리 날짜 기준: 월일(MMDD) 시작값
const SIGN_STARTS = [
  [120, 'aquarius'], [219, 'pisces'], [321, 'aries'], [420, 'taurus'], [521, 'gemini'], [622, 'cancer'],
  [723, 'leo'], [823, 'virgo'], [923, 'libra'], [1024, 'scorpio'], [1123, 'sagittarius'],
];
function signFromBirthDate(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return null;
  const md = Number(m[2]) * 100 + Number(m[3]);
  if (md >= 1222 || md <= 119) return 'capricorn';
  let found = 'capricorn';
  SIGN_STARTS.forEach(([start, key]) => { if (md >= start) found = key; });
  return found;
}

/* 저장소: 브라우저 localStorage. 막혀 있으면(시크릿 모드 등) 메모리에만 저장한다 */
const Store = (function () {
  const KEY = 'byeolharu.profile.v1';
  let memory = null;
  return {
    load() {
      try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { /* 무시 */ }
      return memory;
    },
    save(profile) {
      memory = profile;
      try { localStorage.setItem(KEY, JSON.stringify(profile)); } catch (e) { /* 메모리 사용 */ }
    },
    clear() {
      memory = null;
      try { localStorage.removeItem(KEY); } catch (e) { /* 무시 */ }
    },
  };
})();

const Api = {
  call_(fnName, arg) {
    return new Promise((resolve, reject) => {
      if (!(window.google && google.script && google.script.run)) {
        reject(new Error('Apps Script 환경이 아니에요. 웹앱 주소로 열어 주세요.'));

      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error((err && err.message) || String(err))))[fnName](arg);

function formatDateKo(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return '';
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return `${m[1]}년 ${Number(m[2])}월 ${Number(m[3])}일 (${WEEKDAYS[d.getDay()]})`;
}
/** "10월 16일 금요일" (연도 없는 긴 표기: 화면 제목용) */
function formatDateLong(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
  if (!m) return '';
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return `${Number(m[2])}월 ${Number(m[3])}일 ${WEEKDAYS[d.getDay()]}요일`;
}

let toastTimer = null;
function toast(msg) {

}

/** 스크린리더에 화면 이름을 읽어 주는 안내 */
function announce(text) {
  const el = $('#announcer'); if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = text; }, 60);
}

/* 바텀시트(작은 화면) / 모달(큰 화면). 열리면 포커스가 안으로 들어가고, Esc·바깥 터치로 닫히며, 닫히면 원래 자리로 돌아간다 */
let sheetResolve = null, sheetOpener = null;
function closeSheet(result) {
  const wrap = $('#dialog');
  if (wrap.hidden) return;
  wrap.classList.remove('open');
  wrap.onclick = null; wrap.onkeydown = null;
  setTimeout(() => { if (!wrap.classList.contains('open')) { wrap.hidden = true; wrap.innerHTML = ''; } }, 240);
  if (sheetOpener && sheetOpener.focus) { try { sheetOpener.focus(); } catch (e) { /* 무시 */ } }
  const r = sheetResolve; sheetResolve = null;
  if (r) r(result);
}
function openSheet(opts) {
  return new Promise(resolve => {
    const wrap = $('#dialog');
    sheetOpener = document.activeElement; sheetResolve = resolve;
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="sheetTitle">${esc(opts.title)}</h2>
      <div class="sheet-body">${opts.bodyHtml || ''}</div>
      ${opts.actionsHtml || '<div class="actions"><button class="btn btn-secondary" data-r="close">닫기</button></div>'}</div>`;
    wrap.hidden = false;
    requestAnimationFrame(() => {
      wrap.classList.add('open');
      const sheet = wrap.querySelector('.sheet');
      const first = sheet && sheet.querySelector('[data-r]');
      (first || sheet).focus();
    });
    wrap.onclick = e => {
      const b = e.target.closest('[data-r]');
      if (b) return closeSheet(b.dataset.r);
      if (e.target === wrap) closeSheet(null);
    };
    wrap.onkeydown = e => {
      if (e.key === 'Escape') { closeSheet(null); return; }
      if (e.key !== 'Tab') return;                               // 시트 밖으로 포커스가 나가지 않게 가둔다
      const items = [...wrap.querySelectorAll('button, a[href], input, select, textarea')].filter(x => !x.disabled);
      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
  });
}
/* 확인창 (브라우저 기본 confirm 대신 사용). 확인을 누르면 true */
function confirmDialog(title, message, okLabel) {
  return openSheet({
    title, bodyHtml: `<p>${esc(message)}</p>`,
    actionsHtml: `<div class="actions-2"><button class="btn btn-secondary" data-r="0">취소</button><button class="btn btn-danger" data-r="1">${esc(okLabel || '확인')}</button></div>`,
  }).then(r => r === '1');
}

(function makeStars() {
  const box = $('#stars');
  let html = '';
  for (let i = 0; i < 30; i++) {
    const size = Math.random() < .2 ? 3 : 2;
    html += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;width:${size}px;height:${size}px;animation-delay:${(Math.random() * 4).toFixed(2)}s;animation-duration:${(3 + Math.random() * 3).toFixed(2)}s"></i>`;
  }
  box.innerHTML = html;
})();
